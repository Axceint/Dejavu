<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dejavu</title>
    <script>
      // Set the theme before first paint. Same key and values as the offline report: "dark" = coffee, "light" = cream.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("dejavu:theme") === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
