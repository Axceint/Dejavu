name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read  # PRs can hold AI-drafted code (autofix.yml): give it nothing to steal
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tests.test_engine
      - run: python -m tests.test_edge_cases
      - run: python -m tests.test_problems
      - run: python -m tests.bench
      - run: python -m tests.test_app
      - run: python -m tests.test_margin
      - run: python -m tests.test_ask
      - run: python -m tests.test_watermark
      - run: python -m tests.test_telemetry
      - run: python -m tests.test_adapt
