<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// Same rules and storage key as review.html, so the choice carries from the landing page into the review.
const HOST_THEME = /*__THEME__*/null;
(() => {
  let t = null;
  try { t = localStorage.getItem("dejavu:theme"); } catch (e) { /* storage blocked: fall through */ }
  document.documentElement.dataset.theme = t === "light" || t === "dark" ? t
    : HOST_THEME || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
})();
</script>
<style>
:root{color-scheme:light;--panel:#fffcf7;--sunk:#efe7db;--line2:#d6c8b4;--text:#2a1f17;--accent:#a0522d}
:root[data-theme=dark]{color-scheme:dark;--panel:#231c17;--sunk:#2c241e;--line2:#4a3d33;--text:#f3e9dc;--accent:#e0a36a}
html,body{margin:0;background:transparent;overflow:hidden}
button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
  border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--text)}
button:hover{background:var(--sunk)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
[data-theme=dark] .i-moon,[data-theme=light] .i-sun{display:none}
button:active{transform:translateY(1px)}
.spin svg{animation:spin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:rotate(-90deg) scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
</style>
</head>
<body>
<button id="t" type="button">
  <svg class="i-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.6 5.6 0 0 1 6.2 2.5a5.6 5.6 0 1 0 7.3 7.3Z"/></svg>
  <svg class="i-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg>
</button>
<script>
(() => {
  const root = document.documentElement, btn = document.getElementById("t");
  function setTheme(t, save) {
    root.dataset.theme = t;
    btn.setAttribute("aria-label", `Switch to ${t === "dark" ? "light" : "dark"} theme`);
    btn.title = btn.getAttribute("aria-label");
    if (save) { try { localStorage.setItem("dejavu:theme", t); } catch (e) { /* not saved: still applies now */ } }
    // the host page's CSS repaints itself from this attribute (see app.py)
    // also saved as Streamlit's own theme, so the next load paints in it from the first frame (no flash)
    // shortcut: Streamlit 1.67's internal storage key; if an update renames it, the flash returns until this is updated
    try { const h = window.parent; h.document.documentElement.dataset.dejavuTheme = t;
      h.localStorage.setItem(`stActiveTheme-${h.location.pathname}-v2`, JSON.stringify(t === "dark" ? "Dark" : "Light")); } catch (e) { /* other origin: host keeps its theme */ }
  }
  setTheme(root.dataset.theme, false);
  // the landing page: a double or triple click selects nothing outside fields (review.html does this on the review screen)
  const noMultiSelect = (e) => { if (e.detail > 1 && !e.target.closest("input,textarea,select,[contenteditable]")) e.preventDefault(); };
  try { const d = window.parent.document; d.addEventListener("mousedown", noMultiSelect); addEventListener("pagehide", () => d.removeEventListener("mousedown", noMultiSelect)); } catch (e) { /* other origin */ }
  btn.onclick = () => {  // one crossfade for the whole window, as in review.html
    const apply = () => {
      setTheme(root.dataset.theme === "dark" ? "light" : "dark", true);
      btn.classList.remove("spin"); void btn.offsetWidth; btn.classList.add("spin");
    };
    let d = document;
    try { if (window.parent.document.startViewTransition) d = window.parent.document; } catch (e) { /* other origin */ }
    if (!d.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) apply();
    else d.startViewTransition(apply);
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
    let saved = null;
    try { saved = localStorage.getItem("dejavu:theme"); } catch (err) { /* treat as unsaved */ }
    if (!saved && !HOST_THEME) setTheme(e.matches ? "dark" : "light", false);
  });
})();
</script>
</body>
</html>
